# VRishi Academy service overlay — joins the EXISTING shared infra network.
# Usage:
#   docker compose -f academy-compose.yml --profile p0 up -d --build  # core (orch + persona)
#   docker compose -f academy-compose.yml --profile p1 up -d --build  # + auth + progress
#   docker compose -f academy-compose.yml --profile p2 up -d --build  # + grader
#   docker compose -f academy-compose.yml --profile p3 up -d --build  # + content (future)
# Prereq: the common stack is up (jeeth.ai/infrastructure/docker/infra-stack-compose.yml)
#
# HOST PORTS: 8600-8605 for academy services, 3070 for academy-web dev.

name: vrishi-academy

networks:
  jeethhypno-shared-network-global:
    external: true

x-academy-env: &academy-env
  ACADEMY_DB_URL: postgresql://academy:${ACADEMY_DB_PASSWORD:?set in .env}@jeethhypno-postgres:5432/academy
  REDIS_URL: redis://jeethhypno-redis:6379/3
  MINIO_ENDPOINT: http://jeethhypno-minio:9000
  MINIO_BUCKET: academy-takes
  OLLAMA_URL: http://jeethhypno-ollama:11434
  LIVEKIT_URL: ws://jeethhypno-livekit:7880
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_MINUTES: "60"
  REFRESH_TOKEN_DAYS: "7"
  KAFKA_BOOTSTRAP_SERVERS: jeethhypno-redpanda:9092
  KAFKA_ENABLED: "${KAFKA_ENABLED:-false}"

services:
  # ── P0: Core session engine ──────────────────────────────────────────────
  academy-orchestrator:
    build:
      context: ..
      dockerfile: services/academy-orchestrator/Dockerfile
    container_name: academy-orchestrator
    environment:
      <<: *academy-env
      PERSONA_URL: http://academy-persona:8000
      CORS_ORIGINS: http://localhost:3070
    ports: ["8600:8000"]
    networks: [jeethhypno-shared-network-global]
    profiles: ["p0"]
    restart: unless-stopped

  persona-svc:
    build:
      context: ..
      dockerfile: services/persona-svc/Dockerfile
    container_name: academy-persona
    environment:
      <<: *academy-env
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-gemma3:4b}
    ports: ["8601:8000"]
    networks: [jeethhypno-shared-network-global]
    profiles: ["p0"]
    restart: unless-stopped

  # ── P1: Auth + Persistence ──────────────────────────────────────────────
  academy-user-svc:
    build:
      context: ..
      dockerfile: services/academy-user-svc/Dockerfile
    container_name: academy-user
    environment:
      <<: *academy-env
      CORS_ORIGINS: http://localhost:3070
      ACADEMY_INVITE_CODE: ${ACADEMY_INVITE_CODE:?set ACADEMY_INVITE_CODE in .env}
      ACADEMY_OPEN_REGISTRATION: "${ACADEMY_OPEN_REGISTRATION:-false}"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCKOUT_MINUTES: "15"
    ports: ["8602:8000"]
    networks: [jeethhypno-shared-network-global]
    profiles: ["p1"]
    restart: unless-stopped
    depends_on: []

  academy-progress-svc:
    build:
      context: ..
      dockerfile: services/academy-progress-svc/Dockerfile
    container_name: academy-progress
    environment:
      <<: *academy-env
      CORS_ORIGINS: http://localhost:3070
      COACH_MODEL: ${OLLAMA_DEFAULT_MODEL:-gemma3:4b}
    ports: ["8603:8000"]
    networks: [jeethhypno-shared-network-global]
    profiles: ["p1"]
    restart: unless-stopped
    depends_on: []

  # ── P2: Grading ────────────────────────────────────────────────────────
  academy-grader-svc:
    build:
      context: ..
      dockerfile: services/academy-grader-svc/Dockerfile
    container_name: academy-grader
    environment:
      <<: *academy-env
      CORS_ORIGINS: http://localhost:3070
      COACH_MODEL: ${OLLAMA_DEFAULT_MODEL:-gemma3:4b}
    ports: ["8604:8000"]
    networks: [jeethhypno-shared-network-global]
    profiles: ["p2"]
    restart: unless-stopped

  # ── P3: Zoom Co-Pilot ──────────────────────────────────────────────────
  zoom-copilot-svc:
    build:
      context: ..
      dockerfile: services/zoom-copilot-svc/Dockerfile
    container_name: academy-zoom-copilot
    environment:
      <<: *academy-env
      CORS_ORIGINS: http://localhost:3070
      COACH_MODEL: ${OLLAMA_DEFAULT_MODEL:-gemma3:4b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_ZOOM: zoom-room-photos
      BODY_MAX_BYTES: "10485760"
    ports: ["8605:8000"]
    networks: [jeethhypno-shared-network-global]
    profiles: ["p3"]
    restart: unless-stopped
