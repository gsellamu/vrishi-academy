# VRishi Academy -- AWS Deployment Pipeline (App Runner)
# Triggers after CI passes on main.
# Builds images, pushes to ECR, triggers App Runner redeployment.
#
# Required GitHub Secrets:
#   AWS_DEPLOY_ROLE_ARN   -- IAM role ARN for OIDC federation
#   AWS_ACCOUNT_ID        -- AWS account number for ECR registry
#
# Required GitHub Variables (per environment):
#   AWS_REGION            -- e.g. us-east-1

name: Deploy to AWS

on:
  workflow_run:
    workflows: ["Academy CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: academy-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # ================================================================
  # Gate: Only deploy if CI passed
  # ================================================================
  gate:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - run: echo "CI passed for ${{ github.event.workflow_run.head_sha }}"

  # ================================================================
  # Build & Push to ECR
  # ================================================================
  build-push:
    name: "Push: ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: academy-user-svc
            ecr_repo: vrishi-academy/user-svc
          - name: academy-progress-svc
            ecr_repo: vrishi-academy/progress-svc
          - name: academy-grader-svc
            ecr_repo: vrishi-academy/grader-svc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service.name }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service.ecr_repo }}:${{ needs.gate.outputs.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service.ecr_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # Deploy via App Runner
  # ================================================================
  deploy:
    name: "Deploy: ${{ matrix.service.app_runner_name }}"
    runs-on: ubuntu-latest
    needs: [gate, build-push]
    environment:
      name: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service:
          - app_runner_name: academy-user
          - app_runner_name: academy-progress
          - app_runner_name: academy-grader
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger App Runner deployment
        id: trigger
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ matrix.service.app_runner_name }}'].ServiceArn" \
            --output text)
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "ERROR: Service ${{ matrix.service.app_runner_name }} not found"
            exit 1
          fi
          echo "service_arn=$SERVICE_ARN" >> "$GITHUB_OUTPUT"
          echo "Triggering deployment for ${{ matrix.service.app_runner_name }}"
          aws apprunner start-deployment --service-arn "$SERVICE_ARN"

      - name: Wait for deployment
        timeout-minutes: 10
        run: |
          echo "Waiting for ${{ matrix.service.app_runner_name }} to stabilize..."
          while true; do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ steps.trigger.outputs.service_arn }}" \
              --query 'Service.Status' --output text)
            echo "  Status: $STATUS"
            case "$STATUS" in
              RUNNING)
                echo "Deployment complete"
                break
                ;;
              CREATE_FAILED|DELETE_FAILED|UPDATE_FAILED)
                echo "FAIL: $STATUS"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

  # ================================================================
  # Post-deploy health check
  # ================================================================
  health-check:
    name: Health Verification
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify all services healthy
        run: |
          ALL_OK=true
          for svc in academy-user academy-progress academy-grader; do
            SERVICE_ARN=$(aws apprunner list-services \
              --query "ServiceSummaryList[?ServiceName=='$svc'].ServiceArn" \
              --output text)
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query 'Service.Status' --output text)
            URL=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query 'Service.ServiceUrl' --output text)
            echo "$svc: $STATUS (https://$URL)"

            if [ "$STATUS" != "RUNNING" ]; then
              echo "FAIL: $svc is not RUNNING"
              ALL_OK=false
              continue
            fi

            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://$URL/healthz" || echo "000")
            echo "  healthz: $HTTP"
            if [ "$HTTP" != "200" ]; then
              echo "  WARNING: healthz returned $HTTP"
            fi
          done

          if [ "$ALL_OK" != "true" ]; then
            exit 1
          fi
          echo "All services verified"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Academy Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ needs.gate.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform**: AWS App Runner" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for svc in academy-user academy-progress academy-grader; do
            SERVICE_ARN=$(aws apprunner list-services \
              --query "ServiceSummaryList[?ServiceName=='$svc'].ServiceArn" \
              --output text 2>/dev/null || echo "")
            if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
              URL=$(aws apprunner describe-service \
                --service-arn "$SERVICE_ARN" \
                --query 'Service.ServiceUrl' --output text 2>/dev/null || echo "unknown")
              echo "- **$svc**: https://$URL" >> $GITHUB_STEP_SUMMARY
            fi
          done
